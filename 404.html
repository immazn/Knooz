<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - الصفحة غير موجودة | كنوز الإنشاء التجارية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            background: var(--gray-bg);
        }

        .error-page .error-icon {
            font-size: 6rem;
            color: var(--primary);
            margin-bottom: 1.5rem;
        }

        .error-page h1 {
            font-size: 4rem;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 0.5rem;
        }

        .error-page h2 {
            font-size: 1.5rem;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
        }

        .error-page p {
            color: var(--text-muted);
            max-width: 500px;
            margin-bottom: 2rem;
            line-height: 1.8;
        }

        .error-page .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 0.8rem;
            background: var(--primary);
            color: white;
            padding: 0.9rem 2.5rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            transition: var(--transition);
        }

        .error-page .btn-home:hover {
            background: var(--primary-dark);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(249, 115, 22, 0.3);
        }
    </style>
</head>

<body>
    <div class="error-page">
        <div class="error-icon">
            <i class="fas fa-map-signs"></i>
        </div>
        <h1>404</h1>
        <h2>عذراً! الصفحة غير موجودة</h2>
        <p>قد تكون الصفحة التي تبحث عنها قد تم نقلها أو حذفها أو أن الرابط غير صحيح.</p>
        <a href="index.html" class="btn-home">
            <i class="fas fa-arrow-right"></i> العودة إلى الرئيسية
        </a>
    </div>
</body>

</html>
